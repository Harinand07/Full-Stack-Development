<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Calculator</title>
</head>
<body>
    <input type="text" name="num1" id="num1" placeholder="Enter 1st number">
    <input type = "text" name = "num2" id="num2" placeholder="Enter 2nd number">
    <br><br>
    <button onclick="add()">Add</button>
    <button onclick="subtract()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>
    <h1 id="result">Result will be shown here...</h1>
</body>
</html>

<script>
    function add(x,y){
        const num1 = document.getElementById("num1").value;
        const num2 = document.getElementById("num2").value;
        const sum = parseFloat(num1) + parseFloat(num2);
        document.getElementById("result").innerHTML = sum;
    }

    function subtract(x,y){
        const num1 = document.getElementById("num1").value;
        const num2 = document.getElementById("num2").value;
        const difference = parseFloat(num1) - parseFloat(num2);
        document.getElementById("result").innerHTML = difference;
    }

    function multiply(x,y){
        const num1 = document.getElementById("num1").value;
        const num2 = document.getElementById("num2").value;
        const product = parseFloat(num1) * parseFloat(num2);
        document.getElementById("result").innerHTML = product;
    }

    function divide(x,y){
        const num1 = document.getElementById("num1").value;
        const num2 = document.getElementById("num2").value;
        const quotient = parseFloat(num1) / parseFloat(num2);
        document.getElementById("result").innerHTML = quotient;
    }
</script>
