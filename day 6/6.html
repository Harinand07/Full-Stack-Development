<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get values from input tag </title>
</head>
<body>
    <input type="text" id="ip" placeholder="Enter your name">
    <button onclick="getName()">submit</button>

    <h1 id="nm">Get Name Here...</h1>
</body>
</html>

<script>
    function getName() {
        //step 1 select the element
        const ip = document.getElementById("ip");
        console.log(ip);

        //step 2 get the value from element
        const data = ip.value;
        console.log(data);

        //step 3 select the element where we want to show the value
        const nm = document.getElementById("nm");

        //step 4 set the value to the element
        nm.innerText = ip.value;

    }
        


</script>
